plugins { id 'com.android.application' }

android {
    namespace 'cn.shiping.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.shiping.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}

tasks.register('verifyWebAssets') {
    doLast {
        if (!file('src/main/assets/public/index.html').exists()) {
            throw new GradleException('Missing web assets. Run npm ci && npm run build in mobile/ first.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }

name: Android client
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', 'src/shared/request-headers.ts', 'src/renderer/src/lib/store/prompts/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/shared/request-headers.ts', 'src/renderer/src/lib/store/prompts/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: bash gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: shiping-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
